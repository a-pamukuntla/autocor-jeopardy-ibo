<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Setup - CCNP AUTOCOR Jeopardy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: gold; margin-bottom: 10px; font-size: 2rem; }
        .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }

        .mqtt-bar {
            display: flex; justify-content: center; align-items: center; gap: 20px;
            margin-bottom: 20px; padding: 10px;
            background: rgba(255,255,255,0.05); border-radius: 8px;
        }
        .mqtt-status { font-size: 0.9rem; padding: 6px 12px; border-radius: 5px; }
        .mqtt-status.connected { color: #28a745; }
        .mqtt-status.disconnected { color: #dc3545; }
        .save-status { font-size: 0.9rem; font-weight: bold; transition: opacity 0.5s; }

        /* Tabs */
        .tabs {
            display: flex; gap: 0; margin-bottom: 25px; border-bottom: 2px solid #333;
        }
        .tab-btn {
            padding: 14px 30px; font-size: 1.1rem; font-weight: bold; border: none;
            background: transparent; color: #888; cursor: pointer; border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: #ccc; }
        .tab-btn.active { color: gold; border-bottom-color: gold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Actions bar */
        .actions-bar { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .btn {
            padding: 12px 24px; font-size: 1rem; font-weight: bold; border: none;
            border-radius: 8px; cursor: pointer; transition: all 0.2s;
        }
        .btn:hover { transform: scale(1.03); }
        .btn-primary { background: #049fd9; color: white; }
        .btn-primary:hover { background: #0bb8f7; }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #2fd654; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-warning:hover { background: #ffcd39; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #e8525f; }
        .btn-secondary { background: #555; color: white; }
        .btn-secondary:hover { background: #666; }
        .btn-sm { padding: 8px 12px; font-size: 0.85rem; }

        /* Team cards */
        .team-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        .team-card {
            background: rgba(255,255,255,0.05); border: 2px solid #333; border-radius: 12px;
            padding: 20px; display: grid; grid-template-columns: 80px 1fr auto;
            gap: 20px; align-items: center; transition: border-color 0.2s;
        }
        .team-card:hover { border-color: #049fd9; }
        .team-card.dragging { opacity: 0.5; border-color: gold; }
        .team-icon-preview {
            width: 70px; height: 70px; border-radius: 50%; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #555; background: rgba(0,0,0,0.3); cursor: pointer; position: relative;
        }
        .team-icon-preview img, .team-icon-preview svg { width: 100%; height: 100%; }
        .team-icon-preview:hover::after {
            content: '📷'; position: absolute; inset: 0; display: flex;
            align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); font-size: 1.5rem; border-radius: 50%;
        }
        .team-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field-group { display: flex; flex-direction: column; gap: 4px; }
        .field-group label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
        .field-group input, .field-group textarea {
            padding: 10px 12px; border: 2px solid #333; border-radius: 6px;
            background: rgba(0,0,0,0.3); color: white; font-size: 1rem;
        }
        .field-group input:focus, .field-group textarea:focus { outline: none; border-color: #049fd9; }
        .field-group input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }
        .team-actions { display: flex; flex-direction: column; gap: 8px; }
        .drag-handle { cursor: grab; font-size: 1.5rem; color: #666; user-select: none; text-align: center; margin-bottom: 5px; }
        .drag-handle:active { cursor: grabbing; }

        /* Preview */
        .preview-section {
            background: rgba(255,255,255,0.05); border: 2px solid #333;
            border-radius: 12px; padding: 25px; margin-bottom: 30px;
        }
        .preview-section h3 { color: gold; margin-bottom: 15px; text-align: center; }
        .preview-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .preview-team { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .preview-team .icon { width: 50px; height: 50px; }
        .preview-team .name { font-size: 0.85rem; color: #ccc; }

        /* Branding */
        .branding-section {
            background: rgba(255,255,255,0.05); border: 2px solid #333;
            border-radius: 12px; padding: 30px; margin-bottom: 30px;
        }
        .branding-section h3 { color: gold; margin-bottom: 20px; }
        .branding-fields { display: flex; flex-direction: column; gap: 20px; }
        .branding-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .logo-upload-area {
            width: 100%; height: 80px; border: 2px dashed #555; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            cursor: pointer; transition: border-color 0.2s; padding: 10px;
            background: rgba(0,0,0,0.2);
        }
        .logo-upload-area:hover { border-color: #049fd9; }
        .logo-upload-area img {
            max-height: 60px; max-width: 200px; object-fit: contain;
            background: white; padding: 5px 10px; border-radius: 5px;
        }
        .logo-upload-area .placeholder { color: #888; font-size: 0.95rem; }

        /* Banner preview */
        .banner-preview {
            border: 2px solid gold; border-radius: 8px; overflow: hidden; margin-top: 20px;
        }
        .banner-preview-header {
            background-color: #000055; padding: 10px 20px; display: flex;
            justify-content: space-between; align-items: center; border-bottom: 2px solid gold;
        }
        .banner-preview-left {
            display: flex; align-items: center; gap: 20px;
            background: white; padding: 10px 20px; border-radius: 8px;
        }
        .banner-preview-left img {
            height: 40px; max-width: 180px; object-fit: contain;
        }
        .banner-preview-left h2 {
            color: #049fd9; margin: 0; font-size: 1.4rem; font-weight: 600; white-space: nowrap;
        }
        .banner-preview-status { font-size: 0.9rem; color: #28a745; }

        /* Image modal */
        .image-options {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center;
        }
        .image-options.active { display: flex; }
        .image-modal {
            background: #1a1a2e; border: 2px solid #049fd9; border-radius: 15px;
            padding: 30px; max-width: 450px; width: 90%; text-align: center;
        }
        .image-modal h3 { color: #049fd9; margin-bottom: 20px; }
        .image-modal .option-btns { display: flex; flex-direction: column; gap: 12px; }
        .image-modal input[type="file"] { display: none; }
        .image-modal .path-input {
            width: 100%; padding: 12px; border: 2px solid #333; border-radius: 6px;
            background: rgba(0,0,0,0.3); color: white; font-size: 0.95rem; margin-top: 10px;
        }
        .image-modal .path-input:focus { outline: none; border-color: #049fd9; }

        .config-output {
            background: #000; border: 1px solid #333; border-radius: 8px; padding: 15px;
            font-family: 'Courier New', monospace; font-size: 0.85rem; color: #28a745;
            max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
            display: none; margin-top: 20px;
        }
        .config-output.active { display: block; }

        .empty-state { text-align: center; padding: 60px 20px; color: #666; }
        .empty-state h2 { margin-bottom: 10px; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚙️ Game Setup</h1>
        <p class="subtitle">Configure your Jeopardy deployment</p>

        <div class="mqtt-bar">
            <span id="mqtt-status" class="mqtt-status disconnected">🔴 Connecting...</span>
            <span id="save-status" class="save-status"></span>
        </div>

        <div class="actions-bar">
            <button class="btn btn-success" onclick="publishConfig()">📡 Save & Publish Live</button>
            <button class="btn btn-secondary" onclick="exportConfig()">💾 Download JSON</button>
            <button class="btn btn-warning" onclick="loadFromFile()">📂 Import Config</button>
            <button class="btn btn-secondary" onclick="toggleJson()">{ } View JSON</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('teams')">👥 Teams</button>
            <button class="tab-btn" onclick="switchTab('branding')">🎨 Branding</button>
        </div>

        <!-- TEAMS TAB -->
        <div id="tab-teams" class="tab-content active">
            <div class="preview-section">
                <h3>Team Preview</h3>
                <div class="preview-grid" id="preview-grid"></div>
            </div>

            <div style="text-align:center; margin-bottom: 20px;">
                <button class="btn btn-primary" onclick="addTeam()">+ Add Team</button>
            </div>

            <div id="team-list" class="team-list"></div>

            <div id="empty-state" class="empty-state" style="display:none;">
                <h2>No teams configured</h2>
                <p>Click "+ Add Team" to get started</p>
            </div>
        </div>

        <!-- BRANDING TAB -->
        <div id="tab-branding" class="tab-content">
            <div class="branding-section">
                <h3>Header Banner</h3>
                <div class="branding-fields">
                    <div class="branding-row">
                        <div class="field-group">
                            <label>Header Title</label>
                            <input type="text" id="brand-title" value="" placeholder="CCNP AUTOCOR JEOPARDY" oninput="updateBranding()">
                        </div>
                        <div class="field-group">
                            <label>Logo Image</label>
                            <div class="logo-upload-area" onclick="document.getElementById('logo-file-input').click()">
                                <div id="logo-preview-thumb">
                                    <span class="placeholder">Click to upload logo</span>
                                </div>
                            </div>
                            <input type="file" id="logo-file-input" accept="image/*" style="display:none" onchange="handleLogoUpload(event)">
                        </div>
                    </div>
                    <div class="branding-row">
                        <div class="field-group">
                            <label>Logo Path (alternative to upload)</label>
                            <input type="text" id="brand-logo-path" value="" placeholder="https://example.com/logo.svg or images/logo.png" oninput="updateBranding()">
                        </div>
                        <div class="field-group">
                            <label>&nbsp;</label>
                            <button class="btn btn-danger btn-sm" onclick="clearLogo()">Remove Logo</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="branding-section">
                <h3>Game Options</h3>
                <div class="branding-fields">
                    <div style="display:flex; align-items:center; gap:15px;">
                        <label style="font-size:1rem; color:#ccc; cursor:pointer; display:flex; align-items:center; gap:10px;">
                            <input type="checkbox" id="toggle-final" onchange="branding.showFinalJeopardy = this.checked" style="width:20px;height:20px;cursor:pointer;">
                            Show Final Jeopardy button
                        </label>
                    </div>
                </div>
            </div>

            <div class="branding-section">
                <h3>Live Banner Preview</h3>
                <div class="banner-preview">
                    <div class="banner-preview-header">
                        <div class="banner-preview-left">
                            <img id="banner-preview-logo" src="" alt="Logo" style="display:none;">
                            <h2 id="banner-preview-title">CCNP AUTOCOR JEOPARDY</h2>
                        </div>
                        <div class="banner-preview-status">🟢 Live</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="config-output" class="config-output"></div>
    </div>

    <!-- Image modal for team icons -->
    <div id="image-modal" class="image-options" onclick="closeImageModal(event)">
        <div class="image-modal" onclick="event.stopPropagation()">
            <h3>Set Team Image</h3>
            <div class="option-btns">
                <button class="btn btn-primary" onclick="triggerFileUpload()">📤 Upload Image</button>
                <input type="file" id="file-input" accept="image/*" onchange="handleFileUpload(event)">
                <div style="color:#aaa; font-size:0.9rem;">— or —</div>
                <input type="text" class="path-input" id="image-path-input" placeholder="images/teams/logo.png" onkeydown="if(event.key==='Enter')setImagePath()">
                <button class="btn btn-secondary" onclick="setImagePath()">Set Path</button>
                <button class="btn btn-danger btn-sm" onclick="clearImage()">Remove Image (use initials)</button>
            </div>
        </div>
    </div>

    <input type="file" id="import-input" accept=".json" style="display:none" onchange="handleImport(event)">

    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script>
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const INSTANCE_ID = window.location.host.replace(/[^a-zA-Z0-9]/g, '-');
        const TOPIC_CONFIG = `jeopardy/${INSTANCE_ID}/config`;

        let mqttClient = null;
        let teams = [];
        let branding = { title: "What's The Question?", logo: '', showFinalJeopardy: true };
        let editingTeamIndex = null;

        // --- Tabs ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
        }

        // --- MQTT ---
        function connectMQTT() {
            mqttClient = mqtt.connect(MQTT_BROKER, {
                clientId: 'setup_' + Math.random().toString(16).substr(2, 8),
                clean: true,
                reconnectPeriod: 1000
            });

            mqttClient.on('connect', () => {
                document.getElementById('mqtt-status').textContent = '🟢 Connected';
                document.getElementById('mqtt-status').className = 'mqtt-status connected';
                mqttClient.subscribe(TOPIC_CONFIG);
            });

            mqttClient.on('message', (topic, message) => {
                if (topic === TOPIC_CONFIG) {
                    try {
                        const config = JSON.parse(message.toString());
                        teams = config.teams || [];
                        if (config.branding) {
                            branding = config.branding;
                        }
                        render();
                        renderBrandingForm();
                    } catch (e) {}
                }
            });

            mqttClient.on('error', () => {
                document.getElementById('mqtt-status').textContent = '🔴 Offline';
                document.getElementById('mqtt-status').className = 'mqtt-status disconnected';
            });

            mqttClient.on('offline', () => {
                document.getElementById('mqtt-status').textContent = '🔴 Offline';
                document.getElementById('mqtt-status').className = 'mqtt-status disconnected';
            });
        }

        function publishConfig() {
            const config = buildConfig();
            const json = JSON.stringify(config);
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(TOPIC_CONFIG, json, { qos: 1, retain: true }, (err) => {
                    if (!err) {
                        showSaveStatus('✅ Published live!');
                    } else {
                        showSaveStatus('❌ Publish failed');
                    }
                });
            } else {
                showSaveStatus('❌ Not connected to broker');
            }
        }

        function showSaveStatus(msg) {
            const el = document.getElementById('save-status');
            el.textContent = msg;
            el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 3000);
        }

        // --- Init ---
        async function init() {
            try {
                const res = await fetch('./config.json');
                const config = await res.json();
                teams = config.teams || [];
                if (config.branding) {
                    branding = config.branding;
                }
            } catch (e) {
                teams = [];
            }
            render();
            renderBrandingForm();
            connectMQTT();
        }

        function render() {
            renderList();
            renderPreview();
            updateEmptyState();
        }

        // --- Branding ---
        function renderBrandingForm() {
            document.getElementById('brand-title').value = branding.title || '';
            document.getElementById('brand-logo-path').value = branding.logo && !branding.logo.startsWith('data:') ? branding.logo : '';
            document.getElementById('toggle-final').checked = branding.showFinalJeopardy !== false;
            updateBannerPreview();
            updateLogoThumb();
        }

        function updateBranding() {
            branding.title = document.getElementById('brand-title').value;
            const pathVal = document.getElementById('brand-logo-path').value.trim();
            if (pathVal && !branding.logo.startsWith('data:')) {
                branding.logo = pathVal;
            }
            updateBannerPreview();
        }

        function updateBannerPreview() {
            const titleEl = document.getElementById('banner-preview-title');
            const logoEl = document.getElementById('banner-preview-logo');
            titleEl.textContent = branding.title || 'JEOPARDY';
            if (branding.logo) {
                logoEl.src = branding.logo;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }
        }

        function updateLogoThumb() {
            const thumb = document.getElementById('logo-preview-thumb');
            if (branding.logo) {
                thumb.innerHTML = `<img src="${branding.logo}" alt="Logo" style="max-height:60px;max-width:200px;object-fit:contain;background:white;padding:5px 10px;border-radius:5px;">`;
            } else {
                thumb.innerHTML = '<span class="placeholder">Click to upload logo</span>';
            }
        }

        function handleLogoUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                branding.logo = evt.target.result;
                updateBannerPreview();
                updateLogoThumb();
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        }

        function clearLogo() {
            branding.logo = '';
            document.getElementById('brand-logo-path').value = '';
            updateBannerPreview();
            updateLogoThumb();
        }

        // --- Teams ---
        function renderList() {
            const list = document.getElementById('team-list');
            list.innerHTML = teams.map((team, i) => `
                <div class="team-card" draggable="true" data-index="${i}"
                     ondragstart="dragStart(event)" ondragover="dragOver(event)"
                     ondrop="drop(event)" ondragend="dragEnd(event)">
                    <div>
                        <div class="drag-handle">⠿</div>
                        <div class="team-icon-preview" onclick="openImageModal(${i})" style="border-color: ${team.color};">
                            ${getIconHtml(team)}
                        </div>
                    </div>
                    <div class="team-fields">
                        <div class="field-group">
                            <label>Team ID</label>
                            <input type="text" value="${team.id}" onchange="updateField(${i}, 'id', this.value)" placeholder="unique-id">
                        </div>
                        <div class="field-group">
                            <label>Display Name</label>
                            <input type="text" value="${team.name}" onchange="updateField(${i}, 'name', this.value)" placeholder="Team Name">
                        </div>
                        <div class="field-group">
                            <label>Primary Color</label>
                            <input type="color" value="${team.color}" onchange="updateField(${i}, 'color', this.value)">
                        </div>
                        <div class="field-group">
                            <label>Secondary Color</label>
                            <input type="color" value="${team.secondaryColor || '#ffffff'}" onchange="updateField(${i}, 'secondaryColor', this.value)">
                        </div>
                    </div>
                    <div class="team-actions">
                        <button class="btn btn-danger btn-sm" onclick="removeTeam(${i})">🗑 Remove</button>
                    </div>
                </div>
            `).join('');
        }

        function renderPreview() {
            const grid = document.getElementById('preview-grid');
            grid.innerHTML = teams.map(team => `
                <div class="preview-team">
                    <div class="icon">${getIconHtml(team)}</div>
                    <div class="name">${team.name || 'Unnamed'}</div>
                </div>
            `).join('');
        }

        function getInitials(name) {
            if (!name) return '?';
            return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function getIconHtml(team) {
            if (team.image && team.image.startsWith('data:')) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
            }
            if (team.image) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="this.outerHTML='${getInitialsSvg(team).replace(/'/g, "\\'")}'">`;
            }
            return getInitialsSvg(team);
        }

        function getInitialsSvg(team) {
            const initials = getInitials(team.name);
            const fontSize = initials.length > 1 ? 36 : 50;
            const stroke = team.secondaryColor || '#fff';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${team.color || '#333'}" stroke="${stroke}" stroke-width="3"/><text x="50" y="${fontSize > 36 ? 65 : 62}" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">${initials}</text></svg>`;
        }

        function updateField(index, field, value) {
            teams[index][field] = value;
            if (field === 'id') {
                teams[index].id = value.toLowerCase().replace(/[^a-z0-9-_]/g, '');
            }
            render();
        }

        function addTeam() {
            const num = teams.length + 1;
            const colors = ['#dc3545', '#0d6efd', '#198754', '#ffc107', '#6f42c1', '#fd7e14', '#20c997', '#e91e8c'];
            teams.push({
                id: `team${num}`,
                name: `Team ${num}`,
                color: colors[(num - 1) % colors.length],
                secondaryColor: '#ffffff',
                image: ''
            });
            render();
        }

        function removeTeam(index) {
            if (confirm(`Remove "${teams[index].name}"?`)) {
                teams.splice(index, 1);
                render();
            }
        }

        // Drag and drop
        let dragIndex = null;
        function dragStart(e) { dragIndex = parseInt(e.currentTarget.dataset.index); e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
        function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
        function drop(e) {
            e.preventDefault();
            const dropIndex = parseInt(e.currentTarget.dataset.index);
            if (dragIndex === null || dragIndex === dropIndex) return;
            const [moved] = teams.splice(dragIndex, 1);
            teams.splice(dropIndex, 0, moved);
            dragIndex = null;
            render();
        }
        function dragEnd(e) { e.currentTarget.classList.remove('dragging'); dragIndex = null; }

        // Team image handling
        function openImageModal(index) {
            editingTeamIndex = index;
            document.getElementById('image-modal').classList.add('active');
            document.getElementById('image-path-input').value = teams[index].image || '';
        }
        function closeImageModal(e) {
            if (e.target.id === 'image-modal') {
                document.getElementById('image-modal').classList.remove('active');
                editingTeamIndex = null;
            }
        }
        function triggerFileUpload() { document.getElementById('file-input').click(); }
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                teams[editingTeamIndex].image = evt.target.result;
                document.getElementById('image-modal').classList.remove('active');
                e.target.value = '';
                render();
            };
            reader.readAsDataURL(file);
        }
        function setImagePath() {
            const path = document.getElementById('image-path-input').value.trim();
            if (editingTeamIndex !== null) {
                teams[editingTeamIndex].image = path;
                document.getElementById('image-modal').classList.remove('active');
                render();
            }
        }
        function clearImage() {
            if (editingTeamIndex !== null) {
                teams[editingTeamIndex].image = '';
                document.getElementById('image-modal').classList.remove('active');
                render();
            }
        }

        // --- Config build / export / import ---
        function buildConfig() {
            return {
                branding: {
                    title: branding.title || 'JEOPARDY',
                    logo: branding.logo || '',
                    showFinalJeopardy: branding.showFinalJeopardy !== false
                },
                teams: teams.map(t => ({
                    id: t.id,
                    name: t.name,
                    color: t.color,
                    ...(t.secondaryColor && t.secondaryColor !== '#ffffff' ? { secondaryColor: t.secondaryColor } : {}),
                    image: t.image || ''
                }))
            };
        }

        function exportConfig() {
            const config = buildConfig();
            const json = JSON.stringify(config, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'config.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadFromFile() { document.getElementById('import-input').click(); }
        function handleImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const config = JSON.parse(evt.target.result);
                    teams = config.teams || [];
                    if (config.branding) branding = config.branding;
                    render();
                    renderBrandingForm();
                } catch (err) {
                    alert('Invalid JSON file');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function toggleJson() {
            const output = document.getElementById('config-output');
            if (output.classList.contains('active')) {
                output.classList.remove('active');
            } else {
                output.textContent = JSON.stringify(buildConfig(), null, 2);
                output.classList.add('active');
            }
        }

        function updateEmptyState() {
            document.getElementById('empty-state').style.display = teams.length === 0 ? 'block' : 'none';
        }

        init();
    </script>
</body>
</html>
