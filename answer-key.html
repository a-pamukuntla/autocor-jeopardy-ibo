<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Key - CCNP AUTOCOR Jeopardy</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Login Screen */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        #login-box {
            background: rgba(255,255,255,0.1);
            border: 2px solid #049fd9;
            border-radius: 15px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        #login-box h1 {
            color: #049fd9;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        #login-box p {
            color: #ccc;
            margin-bottom: 30px;
        }
        #password-input {
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            border: 2px solid #049fd9;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: white;
            margin-bottom: 20px;
        }
        #password-input:focus {
            outline: none;
            border-color: #0db8ff;
            box-shadow: 0 0 10px rgba(4, 159, 217, 0.5);
        }
        #login-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            background: #049fd9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #login-btn:hover {
            background: #0db8ff;
            transform: scale(1.02);
        }
        #error-msg {
            color: #ff4444;
            margin-top: 15px;
            display: none;
        }
        
        /* Answer Key Screen */
        #answer-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #049fd9;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        #cisco-logo {
            height: 35px;
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
        header h1 {
            color: #049fd9;
            font-size: 1.5rem;
        }
        #status {
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.1);
        }
        #status.connected {
            color: #28a745;
            border: 2px solid #28a745;
        }
        #status.disconnected {
            color: #dc3545;
            border: 2px solid #dc3545;
        }
        
        .content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        
        #waiting-state {
            display: block;
        }
        #waiting-state h2 {
            color: #049fd9;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        #waiting-state p {
            color: #ccc;
            font-size: 1.2rem;
        }
        
        #answer-display {
            display: none;
            width: 100%;
            max-width: 1200px;
        }
        #current-question {
            background: rgba(255,255,255,0.05);
            border: 2px solid #049fd9;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }
        #current-question h3 {
            color: #049fd9;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        #question-text {
            font-size: 1.8rem;
            line-height: 1.4;
            color: white;
            margin-bottom: 20px;
        }
        #question-value {
            display: inline-block;
            background: gold;
            color: #000;
            padding: 8px 20px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.2rem;
        }
        
        #answer-box {
            background: linear-gradient(135deg, #28a745, #20c997);
            border: 4px solid #fff;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(40, 167, 69, 0.4);
        }
        #answer-box h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #answer-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: white;
            line-height: 1.3;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        #buzzer-info {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,193,7,0.2);
            border: 2px solid #ffc107;
            border-radius: 10px;
        }
        #buzzer-info h4 {
            color: #ffc107;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }
        #buzzing-team {
            font-size: 1.5rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .team-icon {
            width: 40px;
            height: 40px;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen">
        <div id="login-box">
            <h1>🔒 Answer Key</h1>
            <p>Private access for host only</p>
            <input type="password" id="password-input" placeholder="Enter password" autofocus>
            <button id="login-btn" onclick="login()">UNLOCK</button>
            <div id="error-msg">❌ Incorrect password</div>
        </div>
    </div>

    <!-- Answer Screen -->
    <div id="answer-screen">
        <header>
            <div class="header-left">
                <img id="cisco-logo" src="images/learn-with-cisco.png" alt="Logo">
                <h1>ANSWER KEY</h1>
            </div>
            <div id="status" class="disconnected">🔴 Offline</div>
        </header>

        <div class="content">
            <div id="waiting-state">
                <h2>⏳ Waiting for Question</h2>
                <p>Select a question on the main board to see the answer here</p>
            </div>

            <div id="answer-display">
                <div id="current-question">
                    <h3>Current Question</h3>
                    <div id="question-text"></div>
                    <span id="question-value"></span>
                </div>

                <div id="answer-box">
                    <h2>✓ Answer</h2>
                    <div id="answer-text"></div>
                </div>

                <div id="buzzer-info" style="display: none;">
                    <h4>Team Buzzed:</h4>
                    <div id="buzzing-team"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script>
        const CORRECT_PASSWORD = 'Cisco1234!';
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const INSTANCE_ID = window.location.host.replace(/[^a-zA-Z0-9]/g, '-');
        const TOPIC_QUESTION = `jeopardy/${INSTANCE_ID}/question`;
        const TOPIC_BUZZ = `jeopardy/${INSTANCE_ID}/buzz`;
        const TOPIC_CONFIG = `jeopardy/${INSTANCE_ID}/config`;
        
        let TEAMS = {};
        let mqttClient = null;

        function getInitials(name) {
            return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateIcon(team) {
            if (team.image) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">`;
            }
            const initials = getInitials(team.name);
            const fontSize = initials.length > 1 ? 36 : 50;
            const stroke = team.secondaryColor || '#fff';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${team.color}" stroke="${stroke}" stroke-width="3"/><text x="50" y="${fontSize > 36 ? 65 : 62}" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">${initials}</text></svg>`;
        }

        function applyConfig(config) {
            TEAMS = {};
            config.teams.forEach(team => {
                TEAMS[team.id] = {
                    name: team.name,
                    color: team.color,
                    icon: generateIcon(team)
                };
            });
            if (config.branding) {
                applyBranding(config.branding);
            }
        }

        function applyBranding(b) {
            const logo = document.getElementById('cisco-logo');
            const title = document.querySelector('.header-left h1');
            if (b.title) title.textContent = b.title;
            if (b.logo) {
                logo.src = b.logo;
                logo.style.display = 'block';
            } else {
                logo.style.display = 'none';
            }
        }

        async function loadConfig() {
            const res = await fetch('./config.json');
            const config = await res.json();
            applyConfig(config);
        }

        // Login functionality
        async function login() {
            const password = document.getElementById('password-input').value;
            if (password === CORRECT_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('answer-screen').style.display = 'flex';
                await loadConfig();
                connectMQTT();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }

        // Allow Enter key to login
        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        // MQTT Connection
        function connectMQTT() {
            try {
                mqttClient = mqtt.connect(MQTT_BROKER, {
                    clientId: 'answer_key_' + Math.random().toString(16).substr(2, 8),
                    clean: true,
                    reconnectPeriod: 1000
                });

                mqttClient.on('connect', () => {
                    document.getElementById('status').className = 'connected';
                    document.getElementById('status').textContent = '🟢 Connected';
                    
                    mqttClient.subscribe([TOPIC_QUESTION, TOPIC_BUZZ, TOPIC_CONFIG], (err) => {
                        if (err) console.error('Subscribe error:', err);
                    });
                });

                mqttClient.on('message', (topic, message) => {
                    if (topic === TOPIC_CONFIG) {
                        try {
                            const config = JSON.parse(message.toString());
                            applyConfig(config);
                        } catch (e) {}
                        return;
                    }
                    const data = JSON.parse(message.toString());
                    if (topic === TOPIC_QUESTION) {
                        showQuestion(data);
                    } else if (topic === TOPIC_BUZZ) {
                        showBuzzer(data.team);
                    }
                });

                mqttClient.on('error', (err) => {
                    console.error('MQTT Error:', err);
                    document.getElementById('status').className = 'disconnected';
                    document.getElementById('status').textContent = '🔴 Offline';
                });

                mqttClient.on('offline', () => {
                    document.getElementById('status').className = 'disconnected';
                    document.getElementById('status').textContent = '🔴 Offline';
                });

            } catch (err) {
                console.error('Connection failed:', err);
            }
        }

        function showQuestion(data) {
            document.getElementById('waiting-state').style.display = 'none';
            document.getElementById('answer-display').style.display = 'block';
            document.getElementById('buzzer-info').style.display = 'none';
            
            document.getElementById('question-text').textContent = data.question;
            document.getElementById('answer-text').textContent = data.answer;
            document.getElementById('question-value').textContent = '$' + data.points;
        }

        function showBuzzer(team) {
            const buzzerInfo = document.getElementById('buzzer-info');
            const buzzingTeam = document.getElementById('buzzing-team');
            
            buzzerInfo.style.display = 'block';
            buzzingTeam.innerHTML = `
                <div class="team-icon">${TEAMS[team].icon}</div>
                <span>Team ${TEAMS[team].name}</span>
            `;
        }
    </script>
</body>
</html>
