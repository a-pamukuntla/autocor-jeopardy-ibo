<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Key — Showtime</title>
    <link rel="stylesheet" href="showtime-shared.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== LOGIN ===== */
        #login-screen {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
            text-align: center;
            position: relative;
            animation: show-pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }
        .login-eyebrow {
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--gold);
            font-weight: 700;
            margin-bottom: 8px;
        }
        .login-card h1 {
            font-size: 1.7rem;
            margin: 0 0 8px;
            color: var(--ink);
            letter-spacing: 0.02em;
        }
        .login-card .sub {
            color: var(--ink-mute);
            font-size: 0.9rem;
            margin-bottom: 26px;
            letter-spacing: 0.04em;
        }
        .login-icon {
            width: 56px; height: 56px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(255,210,74,0.25), transparent 70%);
            font-size: 1.6rem;
        }
        .login-icon::after {
            content: '';
            position: absolute;
            width: 56px; height: 56px;
            border-radius: 50%;
            border: 1.5px solid var(--gold-soft);
            animation: ring-pulse 2.5s ease-out infinite;
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.85); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .login-card .show-input {
            text-align: center;
            font-size: 1.05rem;
            letter-spacing: 0.04em;
            margin-bottom: 14px;
        }
        #error-msg {
            color: var(--bad);
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            letter-spacing: 0.04em;
        }

        /* ===== ANSWER SCREEN ===== */
        #answer-screen {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }
        .header-title-wrap {
            display: flex; flex-direction: column; line-height: 1;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            position: relative;
            z-index: 1;
        }

        /* waiting */
        #waiting-state {
            text-align: center;
            animation: show-fade-up 0.6s ease-out both;
        }
        .waiting-icon {
            width: 80px; height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255,210,74,0.2), rgba(255,210,74,0.05));
            border: 1.5px solid var(--gold-soft);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            animation: spin-slow 8s linear infinite;
        }
        @keyframes spin-slow { to { transform: rotate(360deg); } }
        #waiting-state h2 {
            color: var(--gold);
            font-size: 2rem;
            margin: 0 0 10px;
            letter-spacing: 0.02em;
            text-shadow: 0 0 28px rgba(255, 210, 74, 0.3);
        }
        #waiting-state .sub {
            color: var(--ink-dim);
            font-size: 1rem;
            letter-spacing: 0.04em;
        }

        /* answer display */
        #answer-display {
            display: none;
            width: 100%;
            max-width: 1100px;
            animation: show-fade-up 0.5s ease-out both;
        }
        .question-panel {
            margin-bottom: 22px;
            padding: 26px 30px;
        }
        .question-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
        }
        .q-label {
            font-size: 0.7rem;
            color: var(--ink-mute);
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-weight: 700;
        }
        .q-value {
            background: linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
            color: #1a1200;
            font-weight: 800;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 1rem;
            letter-spacing: 0.04em;
            box-shadow: 0 4px 14px rgba(255, 210, 74, 0.35), inset 0 1px 0 rgba(255,255,255,0.4);
        }
        .q-category {
            font-size: 0.75rem;
            color: var(--gold);
            letter-spacing: 0.18em;
            text-transform: uppercase;
            font-weight: 700;
        }
        #question-text {
            font-size: 1.6rem;
            line-height: 1.45;
            color: var(--ink);
            font-weight: 500;
            text-wrap: pretty;
        }

        /* THE answer */
        .answer-panel {
            position: relative;
            border-radius: 18px;
            padding: 44px 40px;
            text-align: center;
            background: linear-gradient(135deg, #16823b 0%, #28a745 50%, #20c997 100%);
            border: 1.5px solid rgba(255,255,255,0.3);
            box-shadow:
                0 18px 50px rgba(40, 167, 69, 0.45),
                0 0 80px rgba(40, 167, 69, 0.25),
                inset 0 1px 0 rgba(255,255,255,0.3),
                inset 0 -2px 0 rgba(0,0,0,0.15);
            overflow: hidden;
            animation: show-pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both 0.1s;
        }
        .answer-panel::before {
            content: '';
            position: absolute;
            top: -60%; left: -20%;
            width: 60%; height: 220%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
            transform: rotate(15deg);
            animation: answer-shine 5s ease-in-out infinite;
        }
        @keyframes answer-shine {
            0%, 100% { transform: translateX(-30%) rotate(15deg); }
            50% { transform: translateX(180%) rotate(15deg); }
        }
        .answer-eyebrow {
            font-size: 0.7rem;
            color: rgba(255,255,255,0.85);
            font-weight: 800;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            margin-bottom: 14px;
            position: relative;
        }
        #answer-text {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            line-height: 1.2;
            letter-spacing: 0.01em;
            text-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 24px rgba(255,255,255,0.15);
            position: relative;
            text-wrap: balance;
        }

        /* buzzer info */
        #buzzer-info {
            margin-top: 22px;
            padding: 18px 22px;
            background: linear-gradient(135deg, rgba(255,193,7,0.15), rgba(255,193,7,0.05));
            border: 1.5px solid rgba(255, 193, 7, 0.5);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(255, 193, 7, 0.15), inset 0 1px 0 rgba(255,193,7,0.2);
            animation: show-fade-up 0.4s ease-out both;
        }
        #buzzer-info .label {
            font-size: 0.7rem;
            color: var(--warn);
            letter-spacing: 0.24em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }
        #buzzing-team {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        #buzzing-team .team-icon {
            width: 44px; height: 44px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
        }

        @media (max-width: 700px) {
            #answer-text { font-size: 2.1rem; }
            #question-text { font-size: 1.2rem; }
            .answer-panel { padding: 30px 22px; }
            .question-panel { padding: 20px 22px; }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>

    <!-- Login -->
    <div id="login-screen">
        <div class="show-card show-card--gold login-card">
            <div class="login-icon">🔒</div>
            <div class="login-eyebrow">Host Only</div>
            <h1>Answer Key</h1>
            <div class="sub">Private access — host display</div>
            <input type="password" id="password-input" class="show-input" placeholder="Enter password" autofocus>
            <button id="login-btn" class="show-btn show-btn--gold" style="width:100%;" onclick="login()">Unlock</button>
            <div id="error-msg">✕ Incorrect password</div>
        </div>
    </div>

    <!-- Answer Key -->
    <div id="answer-screen">
        <header class="show-header">
            <div class="header-left">
                <img id="cisco-logo" class="show-logo" src="images/learn-with-cisco.png" alt="Logo">
                <div class="header-title-wrap">
                    <div class="show-eyebrow">Host display</div>
                    <h1 class="show-title">Answer Key<span class="show-badge">Live</span></h1>
                </div>
            </div>
            <div id="status" class="show-pill disconnected"><span class="dot"></span><span id="status-text">Offline</span></div>
        </header>

        <div class="content">
            <div id="waiting-state">
                <div class="waiting-icon">⏳</div>
                <h2>Waiting for question</h2>
                <div class="sub">Pick a tile on the main board to reveal the answer here</div>
            </div>

            <div id="answer-display">
                <div class="show-card question-panel">
                    <div class="question-row">
                        <span class="q-category" id="q-category">Question</span>
                        <span class="q-value" id="question-value">$0</span>
                    </div>
                    <div class="q-label" style="margin-bottom: 8px;">Prompt</div>
                    <div id="question-text"></div>
                </div>

                <div class="answer-panel">
                    <div class="answer-eyebrow">✓ The Answer</div>
                    <div id="answer-text"></div>
                </div>

                <div id="buzzer-info" style="display: none;">
                    <div class="label">Team buzzed</div>
                    <div id="buzzing-team"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="showtime-stars.js"></script>
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script>
        buildStarfield(70);

        const CORRECT_PASSWORD = 'Cisco1234!';
        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const INSTANCE_ID = window.location.host.replace(/[^a-zA-Z0-9]/g, '-');
        const TOPIC_QUESTION = `jeopardy/${INSTANCE_ID}/question`;
        const TOPIC_BUZZ = `jeopardy/${INSTANCE_ID}/buzz`;
        const TOPIC_CONFIG = `jeopardy/${INSTANCE_ID}/config`;

        let TEAMS = {};
        let mqttClient = null;

        function getInitials(name) {
            return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateIcon(team) {
            if (team.image) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">`;
            }
            const initials = getInitials(team.name);
            const fontSize = initials.length > 1 ? 36 : 50;
            const stroke = team.secondaryColor || '#fff';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${team.color}" stroke="${stroke}" stroke-width="3"/><text x="50" y="${fontSize > 36 ? 65 : 62}" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">${initials}</text></svg>`;
        }

        function applyConfig(config) {
            TEAMS = {};
            config.teams.forEach(team => {
                TEAMS[team.id] = {
                    name: team.name,
                    color: team.color,
                    icon: generateIcon(team)
                };
            });
            if (config.branding) applyBranding(config.branding);
        }

        function applyBranding(b) {
            const logo = document.getElementById('cisco-logo');
            const title = document.querySelector('.show-title');
            if (b.title) {
                // keep the badge intact
                const badge = title.querySelector('.show-badge');
                title.firstChild && (title.firstChild.nodeValue = b.title);
                if (!title.firstChild.nodeValue) title.insertBefore(document.createTextNode(b.title), badge);
            }
            if (b.logo) {
                logo.src = b.logo;
                logo.style.display = 'block';
            } else {
                logo.style.display = 'none';
            }
        }

        async function loadConfig() {
            const res = await fetch('./config.json');
            const config = await res.json();
            applyConfig(config);
        }

        function setStatus(state, text) {
            const el = document.getElementById('status');
            const t = document.getElementById('status-text');
            el.classList.remove('connected', 'disconnected');
            el.classList.add(state);
            t.textContent = text;
        }

        async function login() {
            const password = document.getElementById('password-input').value;
            if (password === CORRECT_PASSWORD) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('answer-screen').style.display = 'flex';
                try { await loadConfig(); } catch (e) {}
                connectMQTT();
            } else {
                document.getElementById('error-msg').style.display = 'block';
                document.getElementById('password-input').value = '';
                document.getElementById('password-input').focus();
            }
        }

        document.getElementById('password-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });

        function connectMQTT() {
            try {
                mqttClient = mqtt.connect(MQTT_BROKER, {
                    clientId: 'answer_key_' + Math.random().toString(16).substr(2, 8),
                    clean: true,
                    reconnectPeriod: 1000
                });

                mqttClient.on('connect', () => {
                    setStatus('connected', 'Live');
                    mqttClient.subscribe([TOPIC_QUESTION, TOPIC_BUZZ, TOPIC_CONFIG]);
                });

                mqttClient.on('message', (topic, message) => {
                    if (topic === TOPIC_CONFIG) {
                        try { applyConfig(JSON.parse(message.toString())); } catch (e) {}
                        return;
                    }
                    const data = JSON.parse(message.toString());
                    if (topic === TOPIC_QUESTION) {
                        showQuestion(data);
                    } else if (topic === TOPIC_BUZZ) {
                        showBuzzer(data.team);
                    }
                });

                mqttClient.on('error', () => setStatus('disconnected', 'Error'));
                mqttClient.on('offline', () => setStatus('disconnected', 'Offline'));

            } catch (err) {
                setStatus('disconnected', 'Failed');
            }
        }

        function showQuestion(data) {
            document.getElementById('waiting-state').style.display = 'none';
            const display = document.getElementById('answer-display');
            display.style.display = 'block';
            // re-trigger entrance animation
            display.style.animation = 'none';
            void display.offsetWidth;
            display.style.animation = '';

            document.getElementById('buzzer-info').style.display = 'none';
            document.getElementById('question-text').textContent = data.question;
            document.getElementById('answer-text').textContent = data.answer;
            document.getElementById('question-value').textContent = '$' + data.points;
            document.getElementById('q-category').textContent = data.category || 'Question';
        }

        function showBuzzer(team) {
            const buzzerInfo = document.getElementById('buzzer-info');
            const buzzingTeam = document.getElementById('buzzing-team');
            buzzerInfo.style.display = 'block';
            buzzingTeam.innerHTML = `
                <div class="team-icon">${TEAMS[team] ? TEAMS[team].icon : ''}</div>
                <span>Team ${TEAMS[team] ? TEAMS[team].name : team}</span>
            `;
        }
    </script>
</body>
</html>
