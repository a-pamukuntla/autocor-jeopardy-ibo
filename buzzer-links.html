<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Links — What's The Question?</title>
    <link rel="stylesheet" href="showtime-shared.css">
    <style>
        body {
            min-height: 100vh;
            padding: 32px 20px 60px;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero {
            text-align: center;
            padding: 12px 0 4px;
            animation: show-fade-up 0.5s ease-out both;
        }
        .hero-eyebrow {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .hero h1 {
            font-size: 2rem;
            margin: 0 0 8px;
            color: var(--ink);
            font-weight: 700;
        }
        .hero .sub {
            color: var(--ink-mute);
            font-size: 0.95rem;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            animation: show-fade-up 0.5s ease-out both 0.15s;
        }

        .team-qr-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 28px 20px 24px;
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            border: 2px solid var(--line);
            transition: border-color 0.2s ease;
        }

        .team-qr-card .team-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }

        .team-qr-card .team-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 14px;
        }

        .team-qr-card canvas {
            border-radius: 10px;
            background: white;
            padding: 8px;
            margin-bottom: 12px;
        }

        .team-qr-card .team-url {
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            color: var(--ink-mute);
            word-break: break-all;
            line-height: 1.4;
            max-width: 220px;
        }

        .print-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            animation: show-fade-up 0.5s ease-out both 0.1s;
        }

        @media print {
            body {
                background: white !important;
                color: black !important;
                padding: 10px;
            }
            #starfield, .print-bar, .hero-eyebrow { display: none !important; }
            .show-card, .team-qr-card {
                background: white !important;
                border-color: #ddd !important;
                box-shadow: none !important;
            }
            .hero h1, .team-qr-card .team-name { color: black !important; }
            .hero .sub, .team-qr-card .team-url { color: #555 !important; }
            .team-grid { gap: 12px; }
        }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <div class="container">

        <div class="hero">
            <div class="hero-eyebrow">Showtime</div>
            <h1>📱 Scan to Buzz In</h1>
            <div class="sub">Each team scans their QR code to open their buzzer</div>
        </div>

        <div class="print-bar">
            <button class="show-btn show-btn--gold show-btn--sm" onclick="window.print()">🖨️ Print This Page</button>
        </div>

        <div class="team-grid" id="team-grid"></div>

    </div>

    <script src="showtime-stars.js"></script>
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script>
        buildStarfield(40);

        function getInitials(name) {
            return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateIcon(team) {
            if (team.image) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">`;
            }
            const initials = getInitials(team.name);
            const fontSize = initials.length > 1 ? 36 : 50;
            const stroke = team.secondaryColor || '#fff';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${team.color}" stroke="${stroke}" stroke-width="3"/><text x="50" y="${fontSize > 36 ? 65 : 62}" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">${initials}</text></svg>`;
        }

        async function init() {
            try {
                const res = await fetch('./config.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const config = await res.json();
                renderTeams(config.teams);
            } catch (e) {
                console.warn('config.json fetch failed, trying MQTT retained config...', e);
                loadFromMqtt();
            }
        }

        function loadFromMqtt() {
            const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
            const INSTANCE_ID = window.location.host.replace(/[^a-zA-Z0-9]/g, '-');
            const TOPIC_CONFIG = `jeopardy/${INSTANCE_ID}/config`;

            const client = mqtt.connect(MQTT_BROKER, {
                clientId: 'buzzer-links-' + Math.random().toString(36).slice(2, 8)
            });

            const grid = document.getElementById('team-grid');
            grid.innerHTML = '<p style="color:var(--ink-mute);text-align:center;">Connecting to live config…</p>';

            let timeout = setTimeout(() => {
                grid.innerHTML = '<p style="color:var(--bad);text-align:center;">No config found. Open the <a href="setup.html" style="color:var(--gold)">Setup page</a> and publish your config first.</p>';
                client.end();
            }, 8000);

            client.on('connect', () => {
                client.subscribe(TOPIC_CONFIG);
            });

            client.on('message', (topic, payload) => {
                if (topic === TOPIC_CONFIG) {
                    clearTimeout(timeout);
                    try {
                        const config = JSON.parse(payload.toString());
                        renderTeams(config.teams);
                    } catch (e) {
                        grid.innerHTML = '<p style="color:var(--bad);text-align:center;">Invalid config received.</p>';
                    }
                    client.end();
                }
            });
        }

        function renderTeams(teams) {
            const baseUrl = window.location.origin + window.location.pathname.replace('buzzer-links.html', 'buzzer.html');
            const grid = document.getElementById('team-grid');

            grid.innerHTML = teams.map(team => {
                const url = `${baseUrl}?team=${team.id}`;
                const icon = generateIcon(team);
                return `<div class="team-qr-card" style="border-color: ${team.color};">
                    <div class="team-icon">${icon}</div>
                    <div class="team-name">${team.name}</div>
                    <canvas id="qr-${team.id}"></canvas>
                    <div class="team-url">${url}</div>
                </div>`;
            }).join('');

            teams.forEach(team => {
                const url = `${baseUrl}?team=${team.id}`;
                const canvas = document.getElementById(`qr-${team.id}`);
                QRCode.toCanvas(canvas, url, {
                    width: 180,
                    margin: 1,
                    color: { dark: '#02041a', light: '#ffffff' }
                });
            });
        }

        init();
    </script>
</body>
</html>
