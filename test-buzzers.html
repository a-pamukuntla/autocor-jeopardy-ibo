<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer System Test — Showtime</title>
    <link rel="stylesheet" href="showtime-shared.css">
    <style>
        body {
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .hero {
            text-align: center;
            padding: 8px 0;
            animation: show-fade-up 0.5s ease-out both;
        }
        .hero-eyebrow {
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .hero h1 {
            font-size: 2rem;
            margin: 0 0 6px;
            color: var(--ink);
            font-weight: 700;
        }
        .hero .sub {
            color: var(--ink-mute);
            font-size: 0.95rem;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            animation: show-fade-up 0.5s ease-out both 0.1s;
        }
        .connection {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            animation: show-fade-up 0.5s ease-out both 0.15s;
        }
        @media (max-width: 1024px) {
            .main-content { grid-template-columns: 1fr; }
        }

        .section-title {
            color: var(--gold);
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: 0.04em;
        }

        .buzzer-grid {
            display: grid;
            gap: 12px;
        }
        .buzzer-card {
            background: rgba(255,255,255,0.03);
            border: 2px solid;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: box-shadow 0.2s ease;
        }
        .buzzer-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .team-icon {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }
        .team-info { flex-grow: 1; }
        .team-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--ink);
            margin-bottom: 3px;
        }
        .team-status {
            font-size: 0.8rem;
            color: var(--ink-mute);
        }
        .buzz-btn {
            padding: 10px 22px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.2);
            background: linear-gradient(180deg, #dc3545 0%, #a71d2a 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            min-width: 100px;
        }
        .buzz-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(220,53,69,0.5);
        }
        .buzz-btn:active:not(:disabled) { transform: translateY(1px); }
        .buzz-btn:disabled {
            background: rgba(255,255,255,0.08);
            border-color: var(--line);
            color: var(--ink-mute);
            cursor: not-allowed;
        }
        .buzz-btn.buzzed {
            background: linear-gradient(180deg, #2fd654 0%, #189a3a 100%);
            border-color: rgba(80,230,130,0.5);
        }

        /* MQTT console */
        .mqtt-console {
            display: flex;
            flex-direction: column;
            max-height: 500px;
        }
        .console-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .console-log {
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            font-family: 'Courier New', monospace;
            font-size: 0.82rem;
            overflow-y: auto;
            flex-grow: 1;
            max-height: 400px;
        }
        .log-entry {
            margin-bottom: 10px;
            padding: 8px 10px;
            border-left: 3px solid;
            background: rgba(255,255,255,0.02);
            border-radius: 0 6px 6px 0;
        }
        .log-entry.publish { border-color: var(--gold); }
        .log-entry.receive { border-color: var(--ok); }
        .log-entry.system { border-color: #60a5fa; }
        .log-entry.error { border-color: var(--bad); }
        .log-timestamp { color: var(--ink-mute); font-size: 0.75rem; }
        .log-topic { color: var(--gold); font-weight: bold; }
        .log-payload { color: var(--ok); margin-top: 4px; }

        /* URLs section */
        .urls-section {
            animation: show-fade-up 0.5s ease-out both 0.2s;
        }
        .url-list { display: grid; gap: 10px; }
        .url-item {
            background: rgba(0,0,0,0.3);
            padding: 12px 14px;
            border-radius: 8px;
            border-left: 4px solid;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .url-text {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--ink-dim);
            word-break: break-all;
        }
        .copy-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: rgba(255,255,255,0.05);
            color: var(--ink-dim);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
        .copy-btn.copied { background: rgba(52,210,102,0.15); border-color: var(--ok); color: var(--ok); }
    </style>
</head>
<body>
    <div id="starfield"></div>
    <div class="container">
        <div class="hero">
            <div class="hero-eyebrow">Showtime · Diagnostics</div>
            <h1>🧪 Buzzer System Test</h1>
            <div class="sub">Test all team buzzers and monitor MQTT traffic before your session</div>
        </div>

        <div class="show-card status-bar">
            <div class="connection">
                <span class="show-pill disconnected" id="mqtt-pill">
                    <span class="dot"></span>
                    <span id="status-text">Connecting…</span>
                </span>
            </div>
            <button class="show-btn show-btn--gold show-btn--sm" onclick="resetAllBuzzers()">🔄 Reset All</button>
        </div>

        <div class="main-content">
            <div class="show-card">
                <div class="section-title">Team Buzzers</div>
                <div class="buzzer-grid" id="buzzer-grid"></div>
            </div>

            <div class="show-card mqtt-console">
                <div class="section-title">MQTT Debug Console</div>
                <div class="console-controls">
                    <button class="show-btn show-btn--ghost show-btn--sm" onclick="clearLog()">Clear</button>
                    <button class="show-btn show-btn--ghost show-btn--sm" onclick="toggleAutoScroll()">
                        <span id="autoscroll-text">Auto-scroll: ON</span>
                    </button>
                </div>
                <div class="console-log" id="console-log"></div>
            </div>
        </div>

        <div class="show-card show-card--gold urls-section">
            <div class="section-title">📱 Team Buzzer URLs &amp; QR Codes</div>
            <p style="color: var(--ink-mute); margin-bottom: 14px; font-size: 0.88rem;">
                Share these URLs or scan QR codes to connect each team's buzzer
            </p>
            <div class="url-list" id="url-list"></div>
        </div>
    </div>

    <script src="showtime-stars.js"></script>
    <script src="https://unpkg.com/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
    <script>
        buildStarfield(50);

        const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
        const INSTANCE_ID = window.location.host.replace(/[^a-zA-Z0-9]/g, '-');
        const TOPIC_BUZZ = `jeopardy/${INSTANCE_ID}/buzz`;
        const TOPIC_CONTROL = `jeopardy/${INSTANCE_ID}/control`;
        const TOPIC_CONFIG = `jeopardy/${INSTANCE_ID}/config`;

        let TEAMS = {};
        let client = null;
        let buzzerStates = {};
        let autoScroll = true;

        function getInitials(name) {
            return name.split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2);
        }

        function generateIcon(team) {
            if (team.image) {
                return `<img src="${team.image}" alt="${team.name}" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">`;
            }
            const initials = getInitials(team.name);
            const fontSize = initials.length > 1 ? 36 : 50;
            const stroke = team.secondaryColor || '#fff';
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="${team.color}" stroke="${stroke}" stroke-width="3"/><text x="50" y="${fontSize > 36 ? 65 : 62}" font-size="${fontSize}" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial">${initials}</text></svg>`;
        }

        function applyConfig(config) {
            TEAMS = {};
            buzzerStates = {};
            config.teams.forEach(team => {
                TEAMS[team.id] = { name: team.name, color: team.color, icon: generateIcon(team) };
                buzzerStates[team.id] = true;
            });
        }

        async function loadConfig() {
            const res = await fetch('./config.json');
            const config = await res.json();
            applyConfig(config);
        }

        function renderBuzzerGrid() {
            const grid = document.getElementById('buzzer-grid');
            grid.innerHTML = Object.entries(TEAMS).map(([id, team]) => `
                <div class="buzzer-card" style="border-color: ${team.color};">
                    <div class="team-icon">${team.icon}</div>
                    <div class="team-info">
                        <div class="team-name">${team.name}</div>
                        <div class="team-status" id="status-${id}">Ready</div>
                    </div>
                    <button class="buzz-btn" data-team="${id}" onclick="buzz('${id}')">BUZZ</button>
                </div>
            `).join('');
        }

        function log(message, type = 'system', topic = null, payload = null) {
            const consoleLog = document.getElementById('console-log');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            let html = `<div class="log-timestamp">[${timestamp}]</div>`;
            if (topic) html += `<div class="log-topic">Topic: ${topic}</div>`;
            html += `<div>${message}</div>`;
            if (payload) html += `<div class="log-payload">Payload: ${JSON.stringify(payload, null, 2)}</div>`;
            entry.innerHTML = html;
            consoleLog.appendChild(entry);
            if (autoScroll) consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        function connectMQTT() {
            log(`Instance: ${INSTANCE_ID} → topics: ${TOPIC_BUZZ}, ${TOPIC_CONTROL}`, 'system');
            log('Connecting to MQTT broker...', 'system');
            try {
                client = mqtt.connect(MQTT_BROKER, {
                    clientId: 'test_' + Math.random().toString(16).substr(2, 8),
                    clean: true,
                    reconnectPeriod: 1000
                });

                client.on('connect', () => {
                    const pill = document.getElementById('mqtt-pill');
                    pill.className = 'show-pill connected';
                    document.getElementById('status-text').textContent = 'Connected';
                    log('✅ Connected to MQTT broker successfully', 'system');
                    client.subscribe([TOPIC_BUZZ, TOPIC_CONTROL, TOPIC_CONFIG], (err) => {
                        if (err) log('❌ Subscribe error: ' + err.message, 'error');
                        else log('✅ Subscribed to topics', 'system');
                    });
                });

                client.on('message', (topic, message) => {
                    const msg = message.toString();
                    if (topic === TOPIC_CONFIG) {
                        try {
                            const config = JSON.parse(msg);
                            applyConfig(config);
                            renderBuzzerGrid();
                            renderUrls();
                            log('🔄 Config updated live', 'system');
                        } catch (e) {}
                        return;
                    }
                    if (topic === TOPIC_BUZZ) {
                        try {
                            const data = JSON.parse(msg);
                            log(`📥 Buzz from ${data.team.toUpperCase()}`, 'receive', topic, data);
                            const btn = document.querySelector(`button[data-team="${data.team}"]`);
                            const status = document.getElementById(`status-${data.team}`);
                            if (btn && status) {
                                btn.classList.add('buzzed');
                                btn.disabled = true;
                                status.textContent = '✅ Buzzed!';
                                buzzerStates[data.team] = false;
                            }
                        } catch (e) { log('❌ Parse error: ' + e.message, 'error', topic); }
                    } else if (topic === TOPIC_CONTROL) {
                        try {
                            const data = JSON.parse(msg);
                            log(`📥 Control message`, 'receive', topic, data);
                            if (data.action === 'RESET') {
                                if (data.lockedTeams && data.lockedTeams.length > 0) {
                                    Object.keys(buzzerStates).forEach(team => {
                                        const btn = document.querySelector(`button[data-team="${team}"]`);
                                        const status = document.getElementById(`status-${team}`);
                                        if (data.lockedTeams.includes(team)) {
                                            buzzerStates[team] = false;
                                            if (btn) btn.disabled = true;
                                            if (status) status.textContent = '🔒 Locked';
                                        } else {
                                            buzzerStates[team] = true;
                                            if (btn) { btn.classList.remove('buzzed'); btn.disabled = false; }
                                            if (status) status.textContent = 'Ready';
                                        }
                                    });
                                } else { resetAllBuzzersUI(); }
                            } else if (data.action === 'DISABLE') { disableAllBuzzersUI(); }
                        } catch (e) {
                            log(`📥 Control: ${msg}`, 'receive', topic);
                            if (msg === 'RESET') resetAllBuzzersUI();
                            else if (msg === 'DISABLE') disableAllBuzzersUI();
                        }
                    }
                });

                client.on('error', () => {
                    document.getElementById('mqtt-pill').className = 'show-pill disconnected';
                    document.getElementById('status-text').textContent = 'Error';
                    log('❌ Connection error', 'error');
                });
                client.on('offline', () => {
                    document.getElementById('mqtt-pill').className = 'show-pill disconnected';
                    document.getElementById('status-text').textContent = 'Offline';
                    log('⚠️ Offline, reconnecting...', 'system');
                });
                client.on('reconnect', () => log('🔄 Reconnecting...', 'system'));
            } catch (err) { log('❌ Connection failed: ' + err.message, 'error'); }
        }

        function buzz(team) {
            if (!buzzerStates[team]) return;
            const payload = { team: team, timestamp: Date.now() };
            log(`📤 Buzz for ${team.toUpperCase()}`, 'publish', TOPIC_BUZZ, payload);
            client.publish(TOPIC_BUZZ, JSON.stringify(payload), { qos: 1 }, (err) => {
                if (err) { log('❌ Publish error: ' + err.message, 'error'); return; }
                log('✅ Buzz published', 'publish');
                const btn = document.querySelector(`button[data-team="${team}"]`);
                const status = document.getElementById(`status-${team}`);
                if (btn && status) {
                    btn.classList.add('buzzed');
                    btn.disabled = true;
                    status.textContent = '✅ Buzzed!';
                    buzzerStates[team] = false;
                }
            });
        }

        function resetAllBuzzers() {
            const resetMsg = JSON.stringify({ action: 'RESET', sessionId: Date.now(), lockedTeams: [] });
            log('📤 RESET command', 'publish', TOPIC_CONTROL);
            client.publish(TOPIC_CONTROL, resetMsg, { qos: 1 }, (err) => {
                if (err) log('❌ Reset error: ' + err.message, 'error');
                else { log('✅ RESET published', 'publish'); resetAllBuzzersUI(); }
            });
        }

        function resetAllBuzzersUI() {
            Object.keys(buzzerStates).forEach(team => {
                buzzerStates[team] = true;
                const btn = document.querySelector(`button[data-team="${team}"]`);
                const status = document.getElementById(`status-${team}`);
                if (btn) { btn.classList.remove('buzzed'); btn.disabled = false; }
                if (status) status.textContent = 'Ready';
            });
        }

        function disableAllBuzzersUI() {
            Object.keys(buzzerStates).forEach(team => {
                buzzerStates[team] = false;
                const btn = document.querySelector(`button[data-team="${team}"]`);
                if (btn) btn.disabled = true;
            });
        }

        function clearLog() {
            document.getElementById('console-log').innerHTML = '';
            log('Console cleared', 'system');
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            document.getElementById('autoscroll-text').textContent = `Auto-scroll: ${autoScroll ? 'ON' : 'OFF'}`;
        }

        function copyUrl(team) {
            const urlText = document.getElementById(`url-${team}`).textContent;
            navigator.clipboard.writeText(urlText).then(() => {
                const btn = event.target;
                btn.textContent = '✓ Copied';
                btn.classList.add('copied');
                setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 2000);
            });
        }

        function renderUrls() {
            const baseUrl = window.location.origin + window.location.pathname.replace('test-buzzers.html', 'buzzer.html');
            const urlList = document.getElementById('url-list');
            urlList.innerHTML = Object.entries(TEAMS).map(([id, team]) => {
                const url = `${baseUrl}?team=${id}`;
                return `<div class="url-item" style="border-color: ${team.color};">
                    <canvas id="qr-${id}" style="width:64px;height:64px;border-radius:6px;background:white;padding:4px;flex-shrink:0;"></canvas>
                    <span class="url-text" id="url-${id}">${url}</span>
                    <button class="copy-btn" onclick="copyUrl('${id}')">Copy</button>
                </div>`;
            }).join('');
            Object.entries(TEAMS).forEach(([id]) => {
                const url = `${baseUrl}?team=${id}`;
                QRCode.toCanvas(document.getElementById(`qr-${id}`), url, { width: 128, margin: 1 });
            });
        }

        async function start() {
            await loadConfig();
            renderBuzzerGrid();
            renderUrls();
            connectMQTT();
        }
        start();
    </script>
</body>
</html>
